const results = document.getElementById('results');
let passed = 0;
let failed = 0;

function record(name, error) {
  const row = document.createElement('div');
  row.className = `t t--${error ? 'fail' : 'pass'}`;
  row.textContent = `${error ? '✗' : '✓'} ${name}`;
  if (error) {
    const why = document.createElement('span');
    why.className = 't__why';
    why.textContent = error.message;
    row.append(why);
  }
  results.append(row);
  if (error) failed += 1; else passed += 1;
}

async function test(name, fn) {
  try {
    await fn();
    record(name, null);
  } catch (error) {
    record(name, error);
  }
}

function assert(cond, message) {
  if (!cond) throw new Error(message);
}

function assertEqual(actual, expected, label) {
  if (actual !== expected) {
    throw new Error(`${label}: 期待 ${JSON.stringify(expected)} / 実際 ${JSON.stringify(actual)}`);
  }
}

const SETTINGS = { owner: 'tetsuf0605-rgb', repo: 'soccer-cards-data', token: 'dummy-token' };

/** window.fetch を差し替える。戻り値を呼ぶと元に戻る。 */
function stubFetch(handler) {
  const original = window.fetch;
  window.fetch = async (url, init) => handler(String(url), init ?? {});
  return () => { window.fetch = original; };
}

/** Contents API の成功レスポンス。 */
function okResponse(path) {
  const f = FIXTURES[path];
  return {
    ok: true,
    status: 200,
    json: async () => ({ name: path, path, sha: f.sha, size: f.size, content: f.content, encoding: 'base64' }),
  };
}

function errorResponse(status) {
  return { ok: false, status, json: async () => ({}) };
}

/** 全ファイル成功を返すハンドラ。 */
function allOk(url) {
  const path = url.split('/contents/')[1];
  return FIXTURES[path] ? okResponse(path) : errorResponse(404);
}

/* ========== base64（日本語のUTF-8経路） ========== */

await test('decodeBase64Utf8: 改行入りbase64を復号し日本語が壊れない', () => {
  const text = decodeBase64Utf8(FIXTURES['collection.json'].content);
  const json = JSON.parse(text);
  assertEqual(json.players[0].name, 'ジュード・ベリンガム', 'p-0001の名前');
  assertEqual(json.players[1].name, '三笘薫', 'p-0002の名前');
  assert(json.cards[0].notes.startsWith('裏面:'), 'notesの日本語が壊れている');
});

await test('encodeBase64Utf8: Pythonの符号化結果と1バイトも違わない', () => {
  const text = decodeBase64Utf8(FIXTURES['collection.json'].content);
  const reEncoded = encodeBase64Utf8(text);
  const expected = FIXTURES['collection.json'].content.replace(/\s/g, '');
  assertEqual(reEncoded, expected, 'base64往復');
});

await test('encodeBase64Utf8: btoaが落ちる文字でも通る', () => {
  const tricky = '三笘薫 🇯🇵 Bellingham ½ ＃110';
  assertEqual(decodeBase64Utf8(encodeBase64Utf8(tricky)), tricky, '往復結果');
  let btoaThrew = false;
  try { btoa(tricky); } catch { btoaThrew = true; }
  assert(btoaThrew, '前提が崩れている: btoaが例外を投げていない');
});

/* ========== Contents APIクライアント ========== */

await test('getJsonFile: URL・認証ヘッダ・APIバージョンが正しい', async () => {
  let seenUrl = '';
  let seenHeaders = null;
  const restore = stubFetch((url, init) => {
    seenUrl = url;
    seenHeaders = init.headers;
    return okResponse('collection.json');
  });
  try {
    await getJsonFile(SETTINGS, DATA_FILES.collection);
  } finally { restore(); }

  assertEqual(seenUrl,
    'https://api.github.com/repos/tetsuf0605-rgb/soccer-cards-data/contents/collection.json', 'URL');
  assertEqual(seenHeaders.Authorization, 'Bearer dummy-token', 'Authorizationヘッダ');
  assertEqual(seenHeaders['X-GitHub-Api-Version'], '2022-11-28', 'APIバージョン');
});

await test('fetchAllFiles: 3ファイルを取得しshaを保持する', async () => {
  const restore = stubFetch(allOk);
  let result;
  try { result = await fetchAllFiles(SETTINGS); } finally { restore(); }

  assertEqual(result.collection.sha, FIXTURES['collection.json'].sha, 'collectionのsha');
  assertEqual(result.collection.json.cards.length, 2, 'カード枚数');
  assert(result.prices.ok, 'prices.jsonが取得できていない');
  assertEqual(result.prices.json.prices['c-20260811-k3f'].current, 13000, 'オーバーレイの価格');
  assert(result.playersInfo.ok, 'players_info.jsonが取得できていない');
  assertEqual(result.playersInfo.json.players['p-0001'].infoUpdatedAt, '2026-08-12', 'infoUpdatedAt');
});

await test('オーバーレイが欠けてもcollectionは読める', async () => {
  const restore = stubFetch((url) => (
    url.endsWith('collection.json') ? okResponse('collection.json') : errorResponse(404)
  ));
  let result;
  try { result = await fetchAllFiles(SETTINGS); } finally { restore(); }

  assertEqual(result.collection.json.cards.length, 2, 'カード枚数');
  assertEqual(result.prices.ok, false, 'pricesは失敗しているはず');
  assertEqual(result.playersInfo.ok, false, 'players_infoは失敗しているはず');
  assert(result.prices.error.message.includes('見つかりません'), '404の説明文になっていない');
});

await test('collection.jsonの取得失敗は致命的（例外になる）', async () => {
  const restore = stubFetch(() => errorResponse(500));
  let threw = null;
  try {
    await fetchAllFiles(SETTINGS);
  } catch (error) { threw = error; } finally { restore(); }
  assert(threw !== null, '例外が投げられていない');
  assertEqual(threw.name, 'GitHubError', 'エラー種別');
});

await test('HTTPステータスごとに原因が分かる日本語になる', async () => {
  const cases = [
    [401, 'PATが無効'],
    [403, 'Contents: Read and write'],
    [404, '見つかりません'],
  ];
  for (const [status, needle] of cases) {
    const restore = stubFetch(() => errorResponse(status));
    let message = '';
    try {
      await getJsonFile(SETTINGS, DATA_FILES.collection);
    } catch (error) { message = error.message; } finally { restore(); }
    assert(message.includes(needle), `HTTP ${status} の文言に「${needle}」がない: ${message}`);
  }
});

await test('壊れたJSONを掴んだら「壊れています」と言う', async () => {
  const restore = stubFetch(() => ({
    ok: true, status: 200,
    json: async () => ({ sha: 'x', size: 3, content: encodeBase64Utf8('{ nope') }),
  }));
  let message = '';
  try {
    await getJsonFile(SETTINGS, DATA_FILES.collection);
  } catch (error) { message = error.message; } finally { restore(); }

await test('ネットワーク断はオフライン向けの文言になる', async () => {

  let message = '';
  try {
    await getJsonFile(SETTINGS, DATA_FILES.collection);

/* ========== オーバーレイマージ ========== */

const parse = (path) => JSON.parse(decodeBase64Utf8(FIXTURES[path].content));

await test('マージ: prices.json が collection.json の価格に優先する', () => {
  const base = parse('collection.json');
  const { merged } = mergeCollection(base, parse('prices.json'), parse('players_info.json'));
  const card = merged.cards.find((c) => c.id === 'c-20260811-k3f');

  assertEqual(base.cards[0].price.current, 12000, '前提: 台帳側は12000');
  assertEqual(card.price.current, 13000, 'マージ後の現在価格');
  assertEqual(card.price.checkedAt, '2026-08-12', 'マージ後の確認日');
  assertEqual(card.priceHistory.length, 3, '履歴の件数');
  assertEqual(card.priceHistory[2].price, 13000, '履歴の末尾');
});

await test('マージ: players_info.json が選手情報に優先する', () => {

  assertEqual(base.players[0].infoUpdatedAt, '2026-08-01', '前提: 台帳側は08-01');
  assertEqual(player.infoUpdatedAt, '2026-08-12', 'マージ後の情報更新日');

});

/* ========== ソート ========== */

/** テスト用の行を作る。 */
function row(card, player) {
  return { card: { id: 'c-' + Math.random().toString(36).slice(2, 5), ...card }, player: player ?? null };
}

await test('ソート項目はスキーマ仕様§1の9項目そろっている', () => {
  // v1.3で年齢が増えた（players_info の birthDate から表示時に算出する）
  assertEqual(SORT_OPTIONS.length, 9, '項目数');
  assertEqual(SORT_OPTIONS.map((o) => o.id).join(','),
    'name,nationality,age,price,teamOnCard,currentTeam,status,series,variation', '項目のid');
});

await test('ソート: 現在の価格（昇順・降順）', () => {
  const rows = [
    row({ price: { current: 5000 } }),
    row({ price: { current: 20000 } }),
    row({ price: { current: 12000 } }),
  ];
  assertEqual(sortRows(rows, 'price', false).map((r) => r.card.price.current).join(','),
    '5000,12000,20000', '昇順');
  assertEqual(sortRows(rows, 'price', true).map((r) => r.card.price.current).join(','),
    '20000,12000,5000', '降順');
});

await test('ソート: 値なしは昇順でも降順でも末尾', () => {
  const rows = [
    row({ price: null }),
    row({ price: { current: 8000 } }),
    row({ price: { current: 3000 } }),
  ];
  const asc = sortRows(rows, 'price', false);
  const desc = sortRows(rows, 'price', true);
  assertEqual(asc[asc.length - 1].card.price, null, '昇順で末尾が価格なし');
  assertEqual(desc[desc.length - 1].card.price, null, '降順で末尾が価格なし');
});

await test('ソート: 引退状況は 現役 → 引退 → 不明', () => {
  const rows = [
    row({}, { name: 'C', status: 'unknown' }),
    row({}, { name: 'B', status: 'retired' }),
    row({}, { name: 'A', status: 'active' }),
  ];
  assertEqual(sortRows(rows, 'status', false).map((r) => r.player.status).join(','),
    'active,retired,unknown', '並び順');
});

await test('ソート: playerId経由で結合した選手キーで並ぶ', () => {
  const base = parse('collection.json');
  const { merged } = mergeCollection(base, null, null);
  const rows = buildRows(merged);
  // 三笘薫 / ジュード・ベリンガム を現所属チームで並べる
  const byTeam = sortRows(rows, 'currentTeam', false).map((r) => r.player.currentTeam);
  assertEqual(byTeam.join(' | '), 'Brighton & Hove Albion | Real Madrid', '現所属チーム昇順');
  const byNationality = sortRows(rows, 'nationality', false).map((r) => r.player.nationality);
  assertEqual(byNationality.join(' | '), 'イングランド | 日本', '国籍昇順');
});

await test('ソート: シリーズは数字を数として扱う', () => {
  const rows = [row({ series: 'Prizm 10' }), row({ series: 'Prizm 2' })];
  assertEqual(sortRows(rows, 'series', false).map((r) => r.card.series).join(','),
    'Prizm 2,Prizm 10', '自然順');
});

await test('ソート: 元の配列を書き換えない', () => {
  const rows = [row({ price: { current: 3 } }), row({ price: { current: 1 } })];
  const before = rows.map((r) => r.card.price.current).join(',');
  sortRows(rows, 'price', false);
  assertEqual(rows.map((r) => r.card.price.current).join(','), before, '入力が並び替わってしまった');

await test('詳細: 価格履歴と、オーバーレイ由来の注記が出る', () => {
  const { merged, sources } = mergeCollection(
    parse('collection.json'), parse('prices.json'), parse('players_info.json'));
  const rows = buildRows(merged);
  const target = rows.find((r) => r.card.id === 'c-20260811-k3f');

  assert(text.includes('¥13,000'), 'マージ後の価格が出ていない');

  const dates = [...node.querySelectorAll('.history__date')].map((n) => n.textContent);

/** PUTの成功レスポンス。 */
function putOk(sha) {
  return { ok: true, status: 200, json: async () => ({ content: { sha } }) };
}

await test('putCollection: collection.json へPUTし、日本語がUTF-8で往復する', async () => {
  const base = parse('collection.json');
  let seen = null;
  const restore = stubFetch((url, init) => {
    seen = { url, init };
    return putOk('sha-after');
  });
  let result;
  try {
    result = await putCollection(SETTINGS, base, 'sha-before', 'iphone: add c-20260812-abc');
  } finally { restore(); }

  assertEqual(seen.url,
    'https://api.github.com/repos/tetsuf0605-rgb/soccer-cards-data/contents/collection.json', 'URL');
  assertEqual(seen.init.method, 'PUT', 'メソッド');
  const body = JSON.parse(seen.init.body);
  assertEqual(body.sha, 'sha-before', '楽観ロックのsha');
  assertEqual(body.message, 'iphone: add c-20260812-abc', 'コミットメッセージ');
  const sent = decodeBase64Utf8(body.content);
  assert(sent.includes('三笘薫'), '日本語が壊れている');
  assertEqual(sent, stringifyCollection(base), '送った本文');
  assertEqual(result.sha, 'sha-after', '返ってきたsha');
});

await test('commitCollection: 成功したら1回のPUTで終わる', async () => {
  let puts = 0;
  const restore = stubFetch((url, init) => {
    if ((init.method ?? 'GET') === 'PUT') { puts += 1; return putOk('sha-1'); }
    throw new Error('GETしてはいけない');
  });
  let result;
  try {
    result = await commitCollection(SETTINGS, { json: parse('collection.json'), sha: 'sha-0' }, (json) => ({
      json: { ...json, cards: [...json.cards, { id: 'c-new' }] },
      message: 'iphone: add c-new',
      result: 'ok',
    }));
  } finally { restore(); }

  assertEqual(puts, 1, 'PUT回数');
  assertEqual(result.retried, false, 'retried');
  assertEqual(result.sha, 'sha-1', '新しいsha');
  assertEqual(result.json.cards.length, 3, '書き込んだ中身');
});

await test('commitCollection: 409なら再GETして変更を当て直し、もう一度PUTする', async () => {
  // 他端末が1枚追加した状態を「取り直し」で返す
  const fresh = parse('collection.json');
  fresh.cards.push({ id: 'c-20260812-oth' });

  let puts = 0;
  let gets = 0;
  let lastBody = null;
  const restore = stubFetch((url, init) => {
    if ((init.method ?? 'GET') === 'GET') {
      gets += 1;
      return {
        ok: true, status: 200,
        json: async () => ({ sha: 'sha-fresh', size: 1, content: encodeBase64Utf8(JSON.stringify(fresh)) }),
      };
    }
    puts += 1;
    lastBody = JSON.parse(init.body);
    return puts === 1 ? errorResponse(409) : putOk('sha-2');
  });

  let result;
  try {
    result = await commitCollection(SETTINGS, { json: parse('collection.json'), sha: 'sha-stale' }, (json) => ({
      json: { ...json, cards: [...json.cards, { id: 'c-mine' }] },
      message: 'iphone: add c-mine',
      result: json.cards.length,
    }));
  } finally { restore(); }

  assertEqual(puts, 2, 'PUT回数');
  assertEqual(gets, 1, '再GET回数');
  assertEqual(result.retried, true, 'retried');
  assertEqual(lastBody.sha, 'sha-fresh', '再PUTのshaは取り直したもの');
  assertEqual(result.result, 3, 'applyは取り直した中身に対して当たる');
  // 他端末の1枚を消さずに自分の1枚を足せている
  const ids = result.json.cards.map((c) => c.id);
  assert(ids.includes('c-20260812-oth') && ids.includes('c-mine'), `どちらかが消えた: ${ids}`);
});

/**
 * このページはアプリと同一オリジンなので、テストが本番のキャッシュを壊さないよう
 * 現物を退避してから触り、最後に必ず戻す。
 */
async function withCleanCache(body) {
  const KEY = 'soccer-cards:snapshot';
  const saved = localStorage.getItem(KEY);
  try {
    localStorage.removeItem(KEY);
    await body();
  } finally {
    if (saved === null) localStorage.removeItem(KEY);
    else localStorage.setItem(KEY, saved);
  }
}

const SNAPSHOT = () => ({
  collection: { json: parse('collection.json'), sha: 'sha-abc' },
  overlays: OVERLAYS(),

});

await test('狙い選手: 初回は sha なしでPUTする（未作成のファイルを作る）', async () => {
  let body = null;
  const restore = stubFetch((url, init) => {
    if (init.method === 'PUT') {
      body = JSON.parse(init.body);
      return { ok: true, status: 201, json: async () => ({ content: { sha: 'new-sha' } }) };
    }
    return errorResponse(404);
  });
  let result;
  try {
    result = await commitTargets(SETTINGS, { json: { schemaVersion: 1, targets: [] }, sha: '' }, (json) => ({
      json: addTarget(json, { nameEn: 'Lamine Yamal', name: 'ラミン・ヤマル', playerId: null, note: '' }, NOW_DATE, NOW_STAMP),
      message: 'iphone: targets add Lamine Yamal',
      result: null,
    }));
  } finally { restore(); }

  assertEqual('sha' in body, false, '初回は sha を送らない');
  assertEqual(body.message, 'iphone: targets add Lamine Yamal', 'コミットメッセージ');
  assertEqual(decodeBase64Utf8(body.content).includes('ラミン・ヤマル'), true, 'UTF-8経路のbase64');
  assertEqual(result.sha, 'new-sha', '書き込み後のsha');
});

await test('狙い選手: 2回目は sha を送り、競合したら取り直して当て直す', async () => {
  const puts = [];
  let getCount = 0;
  const stored = { schemaVersion: 1, targets: [] };
  const restore = stubFetch((url, init) => {
    if (init.method === 'PUT') {
      puts.push(JSON.parse(init.body));
      // 1回目は409で弾く
      if (puts.length === 1) return errorResponse(409);
      return { ok: true, status: 200, json: async () => ({ content: { sha: 'sha-2' } }) };
    }
    getCount += 1;
    return {
      ok: true, status: 200,
      json: async () => ({ sha: 'fresh-sha', size: 1, content: encodeBase64Utf8(JSON.stringify(stored)) }),
    };
  });
  let result;
  try {
    result = await commitTargets(SETTINGS, { json: stored, sha: 'stale-sha' }, (json) => ({
      json: addTarget(json, { nameEn: 'Lamine Yamal', name: 'ラミン・ヤマル', playerId: null, note: '' }, NOW_DATE, NOW_STAMP),
      message: 'iphone: targets add Lamine Yamal',
      result: null,
    }));
  } finally { restore(); }

  assertEqual(puts.length, 2, 'PUTは2回');
  assertEqual(puts[0].sha, 'stale-sha', '1回目は手持ちのsha');
  assertEqual(puts[1].sha, 'fresh-sha', '2回目は取り直したsha');
  assertEqual(getCount, 1, '再GETは1回');
  assertEqual(result.retried, true, 'リトライしたことが分かる');
});

  buildDetail(rows.find((r) => r.card.id === 'c-20260811-k3f'), sources, TEAM_INDEX));

/* ========== 集計 ========== */

const summary = document.getElementById('summary');
summary.textContent = failed === 0
  ? `全 ${passed} 件パス`
  : `${failed} 件失敗 / ${passed} 件パス`;
summary.style.color = failed === 0 ? 'var(--accent)' : 'var(--danger)';
document.title = `${failed === 0 ? 'PASS' : 'FAIL'} — セルフテスト`;
</script>
